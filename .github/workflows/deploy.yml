name: Deploy to Oracle VM via Terraform

on:
  push:
    branches:
      - main # Tự động chạy khi bạn push code lên nhánh main

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Infisical Loader
        uses: flarco/infisical-action@v4
        with:
          version: 0.166.5
          client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
          env: prod
          path: /
          # Create a .env file in the root folder. Accepts `true` or `false`
          dotenv: # optional
          # Create a .env.sh file in the root folder. Accepts `true` or `false`
          dotenv_sh: # optional
          # Don't install python (use the system's python)
          use_system_python: # optional

      - name: Setup SSH Key for GitHub Runner
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.VM_SSH_PRIVATE_KEY }}

      - name: Setup Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ env.TF_VAR_ssh_host }} >> ~/.ssh/known_hosts
          echo "TF_VAR_ssh_known_hosts_file=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # - name: Terraform Apply
      #   # Tự động đồng ý (auto-approve) để không bị treo log chờ xác nhận
      #   run: terraform apply -auto-approve

      
      # - uses: hashicorp/setup-terraform@v3
      #   with:
      #     terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Ensure Docker, initialize and apply one workspace
        shell: bash
        env:
          # Temporary diagnostic bypass; remove this override after debugging.
          TF_VAR_ssh_host_key_check: "false"
        run: bash scripts/terraform.sh apply -auto-approve -lock-timeout=5m
