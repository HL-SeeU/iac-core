name: Deploy to Oracle VM via Terraform

on:
  push:
    branches:
      - main # Tự động chạy khi bạn push code lên nhánh main

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Infisical Loader
        uses: flarco/infisical-action@v4
        with:
          version: 0.166.5
          client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          # The client-secret value, typically secrets.INFISICAL_CLIENT_SECRET
          client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          # The project-id or workspace-id value. If not set, will use workspaceId in .infisical.json
          project_id: ${{ secrets.INFISICAL_PROJECT_ID }}
          # The environment to use. If not set, will use .infisical.json
          env: # optional
          # The secrets path value
          path: # optional
          # Create a .env file in the root folder. Accepts `true` or `false`
          dotenv: # optional
          # Create a .env.sh file in the root folder. Accepts `true` or `false`
          dotenv_sh: # optional
          # Don't install python (use the system's python)
          use_system_python: # optional

      - name: Cài đặt SSH Key cho GitHub Runner
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_PRIVATE_KEY }}

      - name: Khai báo máy chủ an toàn (Known Hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan 213.35.102.21 >> ~/.ssh/known_hosts

      - name: Cài đặt Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        # Tự động đồng ý (auto-approve) để không bị treo log chờ xác nhận
        run: terraform apply -auto-approve
